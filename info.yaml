# Tiny Tapeout project information
project:
  title: "UNA2 CPU and Advanced GPU"      # Project title
  author: "Zeenz123"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description: "An 8-bit System-on-Chip featuring a custom CPU designed from scratch, integrated with an AI-engineered Hardware Streaming GPU for 60 FPS FMV gaming via SPI and VGA."      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module: "tt_um_una2_system"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "SPI_MISO"
  ui[1]: "CPU_BUTTON"
  ui[2]: "CPU_IN_2"
  ui[3]: "CPU_IN_3"
  ui[4]: "CPU_IN_4"
  ui[5]: "CPU_IN_5"
  ui[6]: "CPU_IN_6"
  ui[7]: "CPU_IN_7"

  # Outputs
  uo[0]: "VGA_HS / SPI_SCK"
  uo[1]: "VGA_VS / SPI_MOSI"
  uo[2]: "VGA_R / SD_CS"
  uo[3]: "VGA_G / DISP_CS"
  uo[4]: "VGA_B / DISP_DC"
  uo[5]: "Unused"
  uo[6]: "Unused"
  uo[7]: "Unused"

  # Bidirectional pins
  uio[0]: "CPU_BIDIR_0"
  uio[1]: "CPU_BIDIR_1"
  uio[2]: "CPU_BIDIR_2"
  uio[3]: "CPU_BIDIR_3"
  uio[4]: "CPU_BIDIR_4"
  uio[5]: "CPU_BIDIR_5"
  uio[6]: "CPU_BIDIR_6"
  uio[7]: "CPU_BIDIR_7"

# Do not change!
yaml_version: 6
